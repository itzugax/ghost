<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Drop</title>
  <meta name="description" content="Intercambio de archivos efímero. Si no estás aquí, no existe." />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

  <!-- Supabase JS v2 CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>" />
</head>
<body>

  <header>
    <div class="logo">👻 Ghost<span>Drop</span></div>
    <div class="tagline">Comparte archivos. Sin rastro.</div>
  </header>

  <!-- Estado de conexión / zona -->
  <div class="card">
    <div class="card-title">Estado</div>
    <div id="status" class="status info">Iniciando…</div>
    <div id="room-id">Zona: detectando…</div>
  </div>

  <!-- Zona de subida -->
  <div class="card">
    <div class="card-title">Compartir archivo</div>
    <div id="dropzone">
      <span class="drop-icon">📂</span>
      <div class="drop-label">Arrastra un archivo aquí</div>
      <div class="drop-sub">o toca para seleccionar · máx. 50 MB · se destruye en 5 min</div>
    </div>
    <input type="file" id="file-input" />
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <!-- Archivos disponibles en la zona -->
  <div class="card">
    <div class="card-title">Disponibles en tu zona</div>
    <ul id="files-list">
      <li class="empty">Buscando archivos en tu zona…</li>
    </ul>
  </div>

  <footer>
    Ghost Drop · Rastro cero · Efímero por diseño
  </footer>

  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
