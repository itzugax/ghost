<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHOST-DROP — Protocolo Fantasma</title>
  <meta name="description" content="Intercambio de archivos volátil. Si no estás aquí, no existe." />

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👻</text></svg>" />
</head>
<body>

  <header>
    <div class="logo">👻 GHOST<span>-</span>DROP</div>
    <div class="tagline">Si no estás aquí, no existe</div>
  </header>

  <!-- Estado de conexión / zona -->
  <div class="card">
    <div class="card-title">// Estado del Protocolo</div>
    <div id="status" class="status info">Iniciando...</div>
    <div id="room-id">Zona: detectando...</div>
  </div>

  <!-- Zona de subida -->
  <div class="card">
    <div class="card-title">// Dejar un Drop</div>
    <div id="dropzone">
      <span class="drop-icon">📂</span>
      <div class="drop-label">Arrastra un archivo aquí</div>
      <div class="drop-sub">o haz clic para seleccionar · máx. 50 MB · TTL 5 min</div>
    </div>
    <input type="file" id="file-input" />
    <div id="progress-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <!-- Archivos disponibles en la zona -->
  <div class="card">
    <div class="card-title">// Drops en tu Zona</div>
    <ul id="files-list">
      <li class="empty">Buscando drops en tu zona...</li>
    </ul>
  </div>

  <footer>
    GHOST-DROP · Protocolo Fantasma · Rastro cero
  </footer>

  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
