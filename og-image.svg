<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1c1c1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>
  
  <!-- Orb effects -->
  <circle cx="200" cy="150" r="180" fill="#8b5cf6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="950" cy="450" r="200" fill="#3b82f6" opacity="0.06" filter="url(#softGlow)"/>
  
  <!-- Grid pattern (subtle) -->
  <g opacity="0.03" stroke="white" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  
  <!-- Ghost icon -->
  <g transform="translate(520, 100)">
    <!-- Ghost body -->
    <path d="M80 20 C80 5 70 0 60 0 C50 0 40 5 40 20 L40 120 C40 125 35 130 30 130 L30 115 C30 110 25 105 20 110 L20 130 C20 135 15 140 10 135 L10 120 C10 115 5 110 5 115 L5 130 C5 135 0 138 0 130 L0 20 C0 5 10 0 20 0 C30 0 40 5 60 5 C70 5 80 10 80 20Z" fill="url(#accent)" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="28" cy="50" r="8" fill="#0a0a0a"/>
    <circle cx="52" cy="50" r="8" fill="#0a0a0a"/>
    <circle cx="30" cy="48" r="3" fill="white" opacity="0.8"/>
    <circle cx="54" cy="48" r="3" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Main title -->
  <text x="600" y="340" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-2">Ghost Drop</text>
  
  <!-- Subtitle -->
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400" fill="#bebebf" letter-spacing="-0.5">Share encrypted files in 5 seconds. No signup. Zero friction.</text>
  
  <!-- Feature pills -->
  <g transform="translate(310, 450)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="44" rx="22" fill="rgba(139, 92, 246, 0.15)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
    <text x="90" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a78bfa">E2E Encrypted</text>
    
    <!-- Pill 2 -->
    <rect x="200" y="0" width="180" height="44" rx="22" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
    <text x="290" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#60a5fa">Auto-destruct</text>
    
    <!-- Pill 3 -->
    <rect x="400" y="0" width="180" height="44" rx="22" fill="rgba(52, 199, 89, 0.15)" stroke="rgba(52, 199, 89, 0.3)" stroke-width="1"/>
    <text x="490" y="28" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#4ade80">No tracking</text>
  </g>
  
  <!-- URL at bottom -->
  <text x="600" y="570" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#6e6e73" letter-spacing="1">gdrop.vercel.app</text>
  
  <!-- Decorative room code -->
  <text x="600" y="610" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', monospace" font-size="14" fill="#4a4a4e" letter-spacing="8">4 8 2 7 1 9</text>
</svg>
